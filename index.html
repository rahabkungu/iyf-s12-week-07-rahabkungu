<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="container">
        <h1>My To-do List</h1>
        <form id="todo-form">
            <label for="todo-input" class="visually-hidden">New task</label>
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
            <button type="submit">Add</button>
        </form>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="filters" role="group" aria-label="show">
            <button type="button" class="filter filter-btn active"
                data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter filter-btn"
                data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter filter-btn"
                data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <ul id="todo-list"></ul>
        <div class="stats">
            <span id="items-left">0 items left</span>
            <button type="button" id="clear-completed">Clear completed</button>
        </div>
        <p class="hint">Click a task to complete it.
            Double click to edit. Enter saves, Escape cancels.</p>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
